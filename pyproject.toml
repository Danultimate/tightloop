[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI; the import name is `loop`.
name = "tightloop"
version = "0.1.0"
description = "Production-grade loops for AI agents: a structured runtime for reliable, observable, governable agent loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
